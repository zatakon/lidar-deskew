[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-deskew"
version = "0.1.0"
description = "Motion compensation of lidar scans in MCAP / ROS1 bag recordings (no ROS needed)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "rosbags",
    "mcap",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lidar-deskew = "lidar_deskew.cli:main"

[tool.setuptools.packages.find]
include = ["lidar_deskew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
